<template id="scene-3-outro-template">
  <div
    data-composition-id="scene-3-outro"
    data-width="1920"
    data-height="1080"
    data-duration="3"
    data-composition-variables='[
      {"id":"wordmark","type":"string","label":"Wordmark","default":"{{TITLE}}"},
      {"id":"url","type":"string","label":"URL","default":"example.com"}
    ]'
  >
    <div class="canvas">
      <div class="mark" data-var-text="wordmark">{{TITLE}}</div>
      <div class="line"></div>
      <div class="url" data-var-text="url">example.com</div>
    </div>

    <style>
      [data-composition-id="scene-3-outro"] .canvas {
        position: relative;
        width: 1920px;
        height: 1080px;
        background-color: var(--ground);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
      }

      [data-composition-id="scene-3-outro"] .mark {
        color: var(--ink);
        font-size: 92px;
        font-weight: 700;
        letter-spacing: -0.04em;
        opacity: 0;
      }

      [data-composition-id="scene-3-outro"] .line {
        height: 2px;
        width: 220px;
        background: var(--accent);
        transform: scaleX(0);
      }

      [data-composition-id="scene-3-outro"] .url {
        color: var(--muted);
        font-size: 30px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        opacity: 0;
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const root = '[data-composition-id="scene-3-outro"]';
        const tl = gsap.timeline({ paused: true });

        tl.to(root + " .mark", { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.15);
        tl.to(root + " .line", { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.55);
        tl.to(root + " .url", { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-3-outro"] = tl;
      })();
    </script>
  </div>
</template>
