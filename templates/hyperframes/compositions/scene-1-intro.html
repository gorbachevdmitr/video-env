<template id="scene-1-intro-template">
  <div
    data-composition-id="scene-1-intro"
    data-width="1920"
    data-height="1080"
    data-duration="2.5"
    data-composition-variables='[
      {"id":"kicker","type":"string","label":"Kicker","default":"SCENE ONE"},
      {"id":"title","type":"string","label":"Film title","default":"{{TITLE}}"}
    ]'
  >
    <div class="canvas">
      <div class="kicker" data-var-text="kicker">SCENE ONE</div>
      <div class="accent-line"></div>
      <div class="mask">
        <h1 class="title" data-var-text="title">{{TITLE}}</h1>
      </div>
    </div>

    <style>
      [data-composition-id="scene-1-intro"] .canvas {
        position: relative;
        width: 1920px;
        height: 1080px;
        background-color: var(--ground);
        overflow: hidden;
        padding: 0 160px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
      }

      [data-composition-id="scene-1-intro"] .kicker {
        color: var(--accent);
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      [data-composition-id="scene-1-intro"] .accent-line {
        height: 2px;
        width: 88px;
        background: var(--accent);
        transform-origin: left center;
      }

      [data-composition-id="scene-1-intro"] .mask {
        overflow: hidden;
        padding-bottom: 8px;
      }

      [data-composition-id="scene-1-intro"] .title {
        color: var(--ink);
        font-size: 148px;
        line-height: 0.98;
        font-weight: 700;
        letter-spacing: -0.045em;
        transform: translateY(110%);
      }
    </style>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      (function () {
        const root = '[data-composition-id="scene-1-intro"]';
        const tl = gsap.timeline({ paused: true });

        tl.fromTo(root + " .accent-line", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0);
        tl.fromTo(root + " .title", { y: "110%" }, { y: "0%", duration: 0.85, ease: "power4.out" }, 0.12);

        window.__timelines = window.__timelines || {};
        window.__timelines["scene-1-intro"] = tl;
      })();
    </script>
  </div>
</template>
